# arm64 Linux kernels run with 4 KiB, 16 KiB (common on small single-board computers) or 64 KiB
# pages, and the kernel refuses to map an ELF whose PT_LOAD segments are aligned to less than its
# page size. Align to 64 KiB so one aarch64 binary runs on all three. GNU ld and LLD already
# default to this for aarch64; this pins it for toolchains configured otherwise. Note that a
# RUSTFLAGS (or CARGO_ENCODED_RUSTFLAGS) environment variable replaces these flags; carry them
# over when you set one. CARGO_TARGET_<TRIPLE>_RUSTFLAGS adds to them. See packaging/README.md.
#
# `chacha20_force_neon` selects the NEON backend of the `chacha20` crate, which seals sealed
# links (`links.sealed`, orion-link-serial `sealed`): measured on dev at about 2.3x the portable
# code on a Cortex-A76 (16 us instead of 37 us to seal a 4 KiB frame). Every aarch64 Linux target
# has NEON.
[target.aarch64-unknown-linux-gnu]
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=65536", "--cfg", "chacha20_force_neon"]

[target.aarch64-unknown-linux-musl]
rustflags = ["--cfg", "chacha20_force_neon"]

# riscv64 musl links dynamically unless told otherwise, and then fails to find libc. A board's
# files are static on every target.
[target.riscv64gc-unknown-linux-musl]
rustflags = ["-C", "target-feature=+crt-static"]
