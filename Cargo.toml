[workspace]
# Every directory two levels under crates/ must be a crate. Adding a crate never edits this file.
members = ["crates/*/*"]
resolver = "3"

[workspace.package]
edition = "2024"
version = "1.0.1-dev"
license = "MIT OR Apache-2.0"
rust-version = "1.94"
repository = "https://github.com/Prometheus-Dynamics/Orion"
homepage = "https://github.com/Prometheus-Dynamics/Orion"

[workspace.dependencies]
libc = "0.2"
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
serde = { version = "1.0.229", default-features = false, features = ["alloc", "derive"] }
thiserror = { version = "2.0.21", default-features = false }
tokio = { version = "1.53.2", default-features = false }
tracing = "0.1.44"

# Crates that may use `unsafe` (see AGENTS.md) carry their own lint table.
[workspace.lints.rust]
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "deny"
unused_lifetimes = "deny"
unused_attributes = "deny"

[workspace.lints.clippy]
await_holding_lock = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# What ships on boards. Unwinding is what lets a component's panic be contained.
[profile.service]
inherits = "release"
opt-level = "z"
lto = "fat"
panic = "unwind"
strip = true
