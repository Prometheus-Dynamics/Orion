[workspace]
members = [
    "crates/core",
    "crates/auth",
    "crates/service",
    "crates/macros",
    "crates/control-plane",
    "crates/data-plane",
    "crates/link",
    "crates/cluster",
    "crates/runtime",
    "crates/client",
    "crates/orionctl",
    "crates/transport-common",
    "crates/transport-http",
    "crates/transport-tcp",
    "crates/transport-quic",
    "crates/transport-ipc",
    "crates/node",
    "crates/nt4",
    "crates/perf-check",
    "crates/orion",
]
# Standalone crates with their own lockfile and targets (bare-metal templates).
exclude = ["examples/mcu-template"]
resolver = "3"

[workspace.package]
edition = "2024"
version = "1.0.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Prometheus-Dynamics/Orion"
homepage = "https://github.com/Prometheus-Dynamics/Orion"
rust-version = "1.94"
authors = ["Mathias Petersen"]

[workspace.dependencies]
# The model crates (core, data-plane, control-plane, auth, runtime, cluster) support `no_std` +
# `alloc`; their default `std` feature is off here, so every std consumer opts in explicitly with
# `features = ["std"]`.
orion-auth = { path = "crates/auth", version = "1.0.0", default-features = false }
# `ipc` (the Unix-only local client) is opt-in per consumer so `remote` builds stay cross-platform.
orion-client = { path = "crates/client", version = "1.0.0", default-features = false }
orion-cluster = { path = "crates/cluster", version = "1.0.0", default-features = false }
orion-control-plane = { path = "crates/control-plane", version = "1.0.0", default-features = false }
orion-core = { path = "crates/core", version = "1.0.0", default-features = false }
orion-data-plane = { path = "crates/data-plane", version = "1.0.0", default-features = false }
orion-link = { path = "crates/link", version = "1.0.0", default-features = false }
orion-macros = { path = "crates/macros", version = "1.0.0" }
orion-node = { path = "crates/node", version = "1.0.0" }
orion-nt4 = { path = "crates/nt4", version = "1.0.0" }
orion = { path = "crates/orion", version = "1.0.0", default-features = false }
orion-runtime = { path = "crates/runtime", version = "1.0.0", default-features = false }
orion-service = { path = "crates/service", version = "1.0.0" }
orion-transport-common = { path = "crates/transport-common", version = "1.0.0", default-features = false }
orion-transport-http = { path = "crates/transport-http", version = "1.0.0", default-features = false }
orion-transport-ipc = { path = "crates/transport-ipc", version = "1.0.0" }
orion-transport-quic = { path = "crates/transport-quic", version = "1.0.0" }
orion-transport-tcp = { path = "crates/transport-tcp", version = "1.0.0" }
# serde, serde_json, thiserror, and rkyv are declared without
# default features so the model crates stay `no_std`; std consumers add `features = ["std"]`.
# ed25519-dalek (3.x) and sha2 (0.11) have no `std` feature; they are always no_std.
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
serde = { version = "1.0.229", default-features = false, features = ["alloc", "derive"] }
serde_json = { version = "1.0.151", default-features = false, features = ["alloc"] }
serde_path_to_error = "0.1.20" # always no_std + alloc
serde_yaml = "0.9.34"
thiserror = { version = "2.0.21", default-features = false }
tokio = { version = "1.53.2", default-features = false }
toml = "1.1.6"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
clap = { version = "4.6.7", features = ["derive"] }
criterion = { version = "0.8.2", default-features = false }
ed25519-dalek = { version = "3.0.0", default-features = false, features = ["fast", "rand_core", "zeroize"] }
futures-util = { version = "0.3.34", default-features = false }
http = "1.5"
hyper = "1.11"
hyper-util = { version = "0.1.21", features = ["tokio"] }
libc = "0.2"
hmac = "0.13.0"
# mDNS/DNS-SD for opt-in peer discovery (orion-node feature `discovery-mdns`); no async runtime.
mdns-sd = { version = "0.21.5", default-features = false }
mimalloc = { version = "0.1.52", default-features = false }
proc-macro2 = "1.0"
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
quote = "1.0"
getrandom = { version = "0.4", features = ["sys_rng"] }
rcgen = "0.14.10"
rmp = "0.8.15"
rmpv = "1.3.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider"] }
# The layout features (little_endian, pointer_width_64) are fixed for every target, including
# 32-bit MCUs, so the archived wire layout is byte-identical everywhere. `bytecheck` replaces the
# default feature set (which also pulled in `std`). 0.8.16 is the first release whose archived
# string code compiles with `pointer_width_64` on 32-bit targets.
rkyv = { version = "0.8.18", default-features = false, features = ["alloc", "bytecheck", "uuid-1", "little_endian", "pointer_width_64"] }
rustls = { version = "0.23", default-features = false, features = ["std", "ring"] }
rustls-pemfile = "2.2"
rustls-pki-types = "1.15"
sha2 = { version = "0.11.0", default-features = false }
syn = { version = "3.0", features = ["full"] }
tikv-jemallocator = { version = "0.7.0", default-features = false, features = ["background_threads_runtime_support"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "handshake"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "env-filter"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_lifetimes = "deny"
unused_attributes = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
print_stderr = "allow"
print_stdout = "allow"
todo = "deny"
unimplemented = "deny"

# Debug builds (`cargo build`, `cargo test`, clippy's build scripts): workspace crates keep line
# tables, so panics and backtraces still show file:line, but no variable or type info, and
# dependencies get no debug info at all. This cuts compile and link time and the size of the
# target directory; attach a debugger with `CARGO_PROFILE_DEV_DEBUG=full` when you need one.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = "z"
strip = "symbols"
