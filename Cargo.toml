[workspace]
# Every directory two levels under crates/ must be a crate. Adding a crate never edits this file.
members = ["crates/*/*"]
resolver = "3"

[workspace.package]
edition = "2024"
version = "1.0.1-dev"
license = "MIT OR Apache-2.0"
rust-version = "1.94"
repository = "https://github.com/Prometheus-Dynamics/Orion"
homepage = "https://github.com/Prometheus-Dynamics/Orion"

[workspace.dependencies]
# The shared-memory ring family, hosted with the device library (J2).
shm-sample-time = { git = "https://github.com/Prometheus-Dynamics/Lemnos", rev = "b48efaf1af90c52e35b6be27427a93e3d2996f1d" }
shm-ring = { git = "https://github.com/Prometheus-Dynamics/Lemnos", rev = "b48efaf1af90c52e35b6be27427a93e3d2996f1d" }
shm-ring-latest = { git = "https://github.com/Prometheus-Dynamics/Lemnos", rev = "b48efaf1af90c52e35b6be27427a93e3d2996f1d" }
shm-ring-time = { git = "https://github.com/Prometheus-Dynamics/Lemnos", rev = "b48efaf1af90c52e35b6be27427a93e3d2996f1d" }
shm-ring-doorbell = { git = "https://github.com/Prometheus-Dynamics/Lemnos", rev = "b48efaf1af90c52e35b6be27427a93e3d2996f1d" }
shm-ring-buffers = { git = "https://github.com/Prometheus-Dynamics/Lemnos", rev = "b48efaf1af90c52e35b6be27427a93e3d2996f1d" }
shm-ring-holds = { git = "https://github.com/Prometheus-Dynamics/Lemnos", rev = "b48efaf1af90c52e35b6be27427a93e3d2996f1d" }
shm-fdpass = { git = "https://github.com/Prometheus-Dynamics/Lemnos", rev = "b48efaf1af90c52e35b6be27427a93e3d2996f1d" }
libc = "0.2"
postcard = { version = "1.1.3", default-features = false }
serde = { version = "1.0.229", default-features = false, features = ["derive"] }
thiserror = { version = "2.0.21", default-features = false }
tokio = { version = "1.53.2", default-features = false }
tracing = "0.1.44"

# Crates that may use `unsafe` (see AGENTS.md) carry their own lint table.
[workspace.lints.rust]
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "deny"
unused_lifetimes = "deny"
unused_attributes = "deny"

[workspace.lints.clippy]
await_holding_lock = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# What goes on a microcontroller: as small as it gets, and a panic is the end.
[profile.device]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"

# What ships on boards. Unwinding is what lets a component's panic be contained.
[profile.service]
inherits = "release"
opt-level = "z"
lto = "fat"
panic = "unwind"
strip = true
