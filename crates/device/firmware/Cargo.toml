[package]
name = "orion-device-firmware"
description = "New firmware for a microcontroller through the file kinds: two slots, a checked image, a trial the application confirms."
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[package.metadata.orion]
no_std = true

[dependencies]
orion-device-core = { path = "../core" }
orion-wire = { path = "../../core/wire", default-features = false }

[dev-dependencies]
orion-device-host = { path = "../../testing/device-host" }
orion-measure = { path = "../../core/measure", features = ["alloc-counter"] }
orion-msg-files = { path = "../../core/msg-files" }
orion-msg-session = { path = "../../core/msg-session" }
sha2 = { version = "0.11.0", default-features = false }

[lints]
workspace = true
