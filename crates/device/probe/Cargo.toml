[package]
name = "orion-device-probe"
description = "A firmware-shaped use of the device crates, linked to see what they cost in flash and RAM."
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["staticlib", "rlib"]

[features]
# The same device on a CAN bus instead of a byte stream.
can = []
# A device that also declares a topic and publishes it.
topics = ["dep:orion-device-topics"]
# A device that also registers an action and answers it.
actions = ["dep:orion-device-actions"]
# A device that also takes new firmware into two slots.
firmware = ["dep:orion-device-firmware"]

[dependencies]
orion-device-actions = { path = "../actions", optional = true }
orion-device-core = { path = "../core" }
orion-device-firmware = { path = "../firmware", optional = true }
orion-device-topics = { path = "../topics", optional = true }

# C entry points and one static need `unsafe`.
[lints.rust]
unsafe_code = "allow"
unsafe_op_in_unsafe_fn = "deny"
unused_lifetimes = "deny"
unused_attributes = "deny"

[lints.clippy]
await_holding_lock = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
