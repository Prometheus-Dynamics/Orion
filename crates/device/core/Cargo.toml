[package]
name = "orion-device-core"
description = "The device side of the wire for a microcontroller: a session with fixed buffers, no allocator and no clock of its own."
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[package.metadata.orion]
no_std = true

[dependencies]
orion-msg-session = { path = "../../core/msg-session" }
orion-wire = { path = "../../core/wire", default-features = false }

[dev-dependencies]
orion-measure = { path = "../../core/measure", features = ["alloc-counter"] }
orion-types = { path = "../../core/types" }
serde.workspace = true

[lints]
workspace = true
