[package]
name = "orionctl"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Operator CLI for the Orion daemon."
readme = "README.md"

[lints]
workspace = true

[[bin]]
name = "orionctl"
path = "src/main.rs"

[features]
# Every feature is on by default, so a plain build behaves exactly as before. Turning them off
# gives a smaller CLI; requesting a disabled capability fails with an error naming the feature.
# - `http`: `--http` remote targets (and `get health` / `get readiness`) via the HTTP *client*
#   half of orion-transport-http (reqwest + rustls; no axum/hyper server stack). Without it,
#   orionctl talks to orion-node over local IPC only.
# - `yaml`: `-o yaml` output and YAML workload specs (serde_yaml).
# - `toml`: `-o toml` output and TOML workload specs (toml).
# JSON and summary output are always available.
default = ["http", "yaml", "toml"]
http = ["orion-transport-http/client"]
yaml = ["dep:serde_yaml"]
toml = ["dep:toml"]

[dependencies]
clap.workspace = true
orion-client = { workspace = true, features = ["ipc"] }
orion-control-plane = { workspace = true, features = ["std"] }
orion-core = { workspace = true, features = ["std"] }
orion-transport-http.workspace = true
serde = { workspace = true, features = ["std"] }
serde_json = { workspace = true, features = ["std"] }
serde_yaml = { workspace = true, optional = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
toml = { workspace = true, optional = true }

[dev-dependencies]
orion = { workspace = true, features = ["client", "control-plane", "core", "transport-http", "transport-ipc"] }
orion-node.workspace = true
# The YAML/TOML output tests parse orionctl's output; they only run with those features on.
serde_yaml.workspace = true
toml.workspace = true
