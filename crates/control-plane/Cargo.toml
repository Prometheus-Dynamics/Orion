[package]
name = "orion-control-plane"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Canonical control-plane contracts for Orion."
readme = "README.md"

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[features]
# `std` is on by default. Without it the crate is `no_std` + `alloc`: records, messages, mutations,
# typed config decoding, and endpoint parsing keep working; the Prometheus metrics export and the
# filesystem helpers on shared-memory/unix endpoints require `std`.
default = ["std"]
std = [
    "orion-core/std",
    "rkyv/std",
    "serde/std",
    "serde_json/std",
    "thiserror/std",
]

[dependencies]
orion-core.workspace = true
rkyv.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_path_to_error.workspace = true
thiserror.workspace = true

[dev-dependencies]
criterion = { workspace = true, features = ["cargo_bench_support"] }

[[bench]]
name = "mutation_apply"
harness = false
required-features = ["std"]
