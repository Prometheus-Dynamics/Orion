[package]
name = "orion-capi"
description = "The Rust core of liborion: a blocking client of a node's stable interface (link sessions, fd latest-value channel) and its C surface"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
# The shared ABI crate comes from git.
publish = false

[lints]
workspace = true

[dependencies]
abi.workspace = true
libc.workspace = true
orion-control-plane = { workspace = true, features = ["std"] }
orion-core = { workspace = true, features = ["std"] }
orion-link = { workspace = true, features = ["std"] }

[dev-dependencies]
orion-transport-ipc.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "time"] }
