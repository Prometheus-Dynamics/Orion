# `scripts/capi.sh header` writes include/orion/orion.h from this; CI checks it is current.
language = "C"
include_guard = "ORION_H"
include_version = false
no_includes = true
sys_includes = ["stddef.h", "stdint.h"]
includes = ["lemnos/abi.h"]
cpp_compat = true
documentation = true
documentation_style = "c"
style = "type"
usize_is_size_t = true
autogen_warning = "/* Generated by cbindgen from crates/capi (scripts/capi.sh header). Do not edit. */"
header = """/*
 * liborion: Orion's C library over the stable interface (docs/capi.md).
 *
 * Call orion_check_version(&(LemnosAbiVersion){sizeof(LemnosAbiVersion), ORION_ABI_MAJOR,
 * ORION_ABI_MINOR, ORION_LAYOUT_HASH}) before anything else. The shared types (status codes,
 * handles, the version handshake, message sinks) are the ones of the shared ABI header included
 * below, shipped beside this one.
 */"""

[export]
include = ["OrionEvent", "OrionLatestFrame"]
# The Rust modules' own limits.
exclude = ["MAX_PAYLOAD", "MAX_FDS", "MAX_FRAME"]

[export.rename]
"Status" = "LemnosStatus"
"Handle" = "LemnosHandle"
"AbiVersion" = "LemnosAbiVersion"
"MessageSink" = "LemnosMessageSink"
"Features" = "LemnosFeatures"

[parse]
parse_deps = false

[const]
allow_static_const = false
