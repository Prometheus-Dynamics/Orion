[package]
name = "orion-types"
description = "Names, ids, time and the error type every Orion crate shares."
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[package.metadata.orion]
no_std = true

[dependencies]
serde.workspace = true
# `now`: reads CLOCK_MONOTONIC. Off on a microcontroller, which stamps from its own clock.
rustix = { version = "1", default-features = false, features = ["time"], optional = true }

[features]
now = ["dep:rustix"]

[dev-dependencies]
postcard.workspace = true

[lints]
workspace = true
