[package]
name = "orion-measure"
description = "Counting allocator, per-message costs and the zero-allocation harness."
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[features]
default = []
# The counting allocator and the harness built on it.
alloc-counter = []
