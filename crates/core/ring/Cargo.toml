[package]
name = "orion-ring"
description = "The shared-memory topic ring: one writer, many readers, no system call to publish."
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
libc.workspace = true
orion-types = { path = "../types" }

[dev-dependencies]
orion-measure = { path = "../measure", features = ["alloc-counter"] }

# Shared memory needs `unsafe`. It is all in `src/map.rs`; the rest of the crate denies it.
[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
unused_lifetimes = "deny"
unused_attributes = "deny"

[lints.clippy]
await_holding_lock = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
