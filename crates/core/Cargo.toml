[package]
name = "orion-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Core identities, types, and shared errors for Orion."
readme = "README.md"

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[features]
# `std` is on by default. Without it the crate is `no_std` + `alloc` (IDs, revisions, type names,
# errors, and the rkyv archive helpers all keep working).
default = ["std"]
std = ["rkyv/std", "serde/std", "thiserror/std"]

[dependencies]
rkyv.workspace = true
serde.workspace = true
thiserror.workspace = true
