[package]
name = "orion-ring-doorbell"
description = "Waking a sleeping subscriber: an eventfd rung only when its owner is asleep."
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
libc.workspace = true
orion-ring = { path = "../ring" }

[dev-dependencies]
loom = "0.7.3"
orion-measure = { path = "../measure", features = ["alloc-counter"] }

# The eventfd calls need `unsafe`. They are all in `src/eventfd.rs`; the rest denies it.
[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
unused_lifetimes = "deny"
unused_attributes = "deny"

[lints.clippy]
await_holding_lock = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
