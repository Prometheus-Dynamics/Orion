[package]
name = "orion-ring-buffers"
description = "Buffer topics: a pool of shared buffers handed over once, and ring entries that name them."
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
libc.workspace = true
orion-ring = { path = "../ring" }

[dev-dependencies]
orion-fdpass = { path = "../fdpass" }
orion-measure = { path = "../measure", features = ["alloc-counter"] }

# Mapping the buffers needs `unsafe`. It is all in `src/map.rs`; the rest denies it.
[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
unused_lifetimes = "deny"
unused_attributes = "deny"

[lints.clippy]
await_holding_lock = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
