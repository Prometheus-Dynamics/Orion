[package]
name = "orion-nt4"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "NetworkTables 4.1 (FRC NT4) client and server: pub/sub over WebSocket with MessagePack values, RTT time sync, and a local API for hosts."
readme = "README.md"
keywords = ["frc", "networktables", "nt4", "websocket"]
categories = ["network-programming", "asynchronous"]

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[features]
# Both halves are on by default. A consumer that needs one side builds with
# `default-features = false, features = ["client"]` (or `"server"`).
default = ["client", "server"]
# The client needs the WebSocket connector (`connect_async`); the server needs only the handshake.
client = ["tokio-tungstenite/connect"]
server = []

[[example]]
name = "nt4-dump"
path = "examples/nt4-dump.rs"
required-features = ["client"]

[[example]]
name = "nt4-server"
path = "examples/nt4-server.rs"
required-features = ["server"]

[[example]]
name = "nt4-latency"
path = "examples/nt4-latency/main.rs"
required-features = ["client", "server"]

[dependencies]
futures-util.workspace = true
rmp.workspace = true
rmpv.workspace = true
serde = { workspace = true, features = ["std"] }
serde_json = { workspace = true, features = ["std"] }
thiserror = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tokio-tungstenite.workspace = true

[dev-dependencies]
clap = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "io-std", "io-util"] }
