[package]
name = "orion-ssh-sftp"
description = "The sftp subsystem: a helper process that serves files as the user who logged in."
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[dependencies]
orion-ssh = { path = "../ssh" }
russh-sftp = "=3.0.1"
tokio = { workspace = true, features = ["rt", "io-std", "io-util", "sync"] }

[dev-dependencies]
orion-check = { path = "../../core/check" }
orion-keys = { path = "../keys" }
orion-types = { path = "../../core/types" }
russh = { version = "=0.65.1", default-features = false, features = ["ring"] }
rustix = { version = "1", default-features = false, features = ["std", "process"] }
tokio = { workspace = true, features = ["rt", "macros", "time", "net", "sync"] }

[lints]
workspace = true
