[package]
autotests = false
name = "orion-broker"
description = "The topic broker: makes rings, hands their ends out once, and then stays out of the way."
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lib]
# No unit tests in the library: not compiled again to run none (scripts/workspace.py lib-tests).
test = false

[dependencies]
orion-config = { path = "../../core/config" }
orion-msg-topics = { path = "../../core/msg-topics" }
shm-ring = { workspace = true }
shm-ring-doorbell = { workspace = true }
orion-server = { path = "../server" }
orion-types = { path = "../../core/types" }
orion-wire = { path = "../../core/wire" }
tracing.workspace = true

[dev-dependencies]
libc.workspace = true
orion-msg-session = { path = "../../core/msg-session" }
orion-scratch = { path = "../../testing/scratch" }
shm-ring-doorbell = { workspace = true }
orion-unix = { path = "../unix" }
tokio = { workspace = true, features = ["rt", "time", "macros", "net", "test-util"] }

# The integration tests, in one binary: one link for the crate, not one for each file
# (tests/all.rs). A test file that needs features says so on its module there.
[[test]]
name = "all"
path = "tests/all.rs"

[lints]
workspace = true
