[package]
name = "orion-self-status"
description = "The board's vital signs and Orion's own state, as topics: sampled only while someone watches."
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
orion-broker = { path = "../broker" }
orion-msg-topics = { path = "../../core/msg-topics" }
shm-ring = { workspace = true }
orion-server = { path = "../server" }
orion-supervise = { path = "../../core/supervise" }
tokio = { workspace = true, features = ["rt", "time", "sync", "macros"] }

[dev-dependencies]
orion-msg-session = { path = "../../core/msg-session" }
shm-ring-doorbell = { workspace = true }
orion-types = { path = "../../core/types" }
orion-unix = { path = "../unix" }
orion-wire = { path = "../../core/wire" }
orion-values = { path = "../../core/values" }
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
