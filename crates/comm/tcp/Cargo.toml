[package]
autotests = false
name = "orion-tcp"
description = "The network carrier, orion+tcp: a signed session between nodes and to people's tools."
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lib]
# No unit tests in the library: not compiled again to run none (scripts/workspace.py lib-tests).
test = false

[dependencies]
hmac = "0.13.0"
orion-keys = { path = "../keys" }
orion-net-handshake = { path = "../../core/net-handshake" }
orion-server = { path = "../server" }
orion-supervise = { path = "../../core/supervise" }
rustix = { version = "1", default-features = false, features = ["std", "net"] }
sha2 = { version = "0.11.0", default-features = false }
tokio = { workspace = true, features = ["net", "io-util", "time", "sync", "rt"] }
tracing.workspace = true
x25519-dalek = { version = "3.0.0", default-features = false }

[dev-dependencies]
orion-msg-session = { path = "../../core/msg-session" }
orion-types = { path = "../../core/types" }
orion-wire = { path = "../../core/wire" }
tokio = { workspace = true, features = ["macros", "test-util"] }

# The integration tests, in one binary: one link for the crate, not one for each file
# (tests/all.rs). A test file that needs features says so on its module there.
[[test]]
name = "all"
path = "tests/all.rs"

[lints]
workspace = true
