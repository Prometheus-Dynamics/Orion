[package]
name = "orion-tcp"
description = "The network carrier, orion+tcp: a signed session between nodes and to people's tools."
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
hmac = "0.13.0"
orion-keys = { path = "../keys" }
orion-net-handshake = { path = "../../core/net-handshake" }
orion-server = { path = "../server" }
orion-supervise = { path = "../../core/supervise" }
sha2 = { version = "0.11.0", default-features = false }
tokio = { workspace = true, features = ["net", "io-util", "time", "sync", "rt"] }
tracing.workspace = true
x25519-dalek = { version = "3.0.0", default-features = false }

[dev-dependencies]
orion-msg-session = { path = "../../core/msg-session" }
orion-types = { path = "../../core/types" }
orion-wire = { path = "../../core/wire" }
tokio = { workspace = true, features = ["macros", "test-util"] }

[lints]
workspace = true
