[package]
name = "orion-broker-buffers"
description = "Buffer topics in the broker: a publisher's buffers taken once and handed to each subscriber once."
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
orion-broker = { path = "../broker" }
