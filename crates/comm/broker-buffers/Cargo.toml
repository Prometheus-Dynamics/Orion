orion-wire = { path = "../../core/wire" }
tracing.workspace = true

[dev-dependencies]
orion-msg-session = { path = "../../core/msg-session" }
shm-ring = { workspace = true }
shm-ring-buffers = { workspace = true }
shm-ring-doorbell = { workspace = true }
shm-ring-holds = { workspace = true }
orion-types = { path = "../../core/types" }
tokio = { workspace = true, features = ["rt", "time", "macros", "test-util"] }

[lints]
workspace = true
