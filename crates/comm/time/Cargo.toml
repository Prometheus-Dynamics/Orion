[package]
name = "orion-time"
description = "Time sync: SNTP client and server, a peer's or an operator's clock, report and discipline modes."
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
orion-broker = { path = "../broker" }
orion-config = { path = "../../core/config" }
orion-measure = { path = "../../core/measure", features = ["clock"] }
orion-msg-peers = { path = "../../core/msg-peers" }
orion-msg-topics = { path = "../../core/msg-topics" }
orion-ring = { path = "../../core/ring" }
orion-server = { path = "../server" }
orion-wire = { path = "../../core/wire" }
tokio = { workspace = true, features = ["net", "io-util", "time", "sync", "rt", "macros"] }
tracing.workspace = true

orion-types = { path = "../../core/types", features = ["now"] }

[dev-dependencies]
orion-msg-session = { path = "../../core/msg-session" }
orion-ring-doorbell = { path = "../../core/ring-doorbell" }
orion-unix = { path = "../unix" }
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
