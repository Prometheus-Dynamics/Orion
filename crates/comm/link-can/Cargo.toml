[package]
autotests = false
name = "orion-link-can"
description = "Links over a CAN bus: the one wire in segments, many devices on one bus, classic CAN and CAN FD."
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lib]
# No unit tests in the library: not compiled again to run none (scripts/workspace.py lib-tests).
test = false

[features]
default = []
# The kernel's CAN sockets, through the `socketcan` crate. Linux.
socketcan = ["dep:socketcan"]

[dependencies]
orion-server = { path = "../server" }
orion-supervise = { path = "../../core/supervise" }
orion-types = { path = "../../core/types" }
orion-wire = { path = "../../core/wire", features = ["std"] }
socketcan = { version = "4.0.0", default-features = false, features = ["tokio"], optional = true }
tokio = { workspace = true, features = ["time", "sync", "rt", "macros"] }
tracing.workspace = true

[dev-dependencies]
orion-broker = { path = "../broker" }
orion-hello = { path = "../hello" }
orion-keys = { path = "../keys" }
orion-msg-session = { path = "../../core/msg-session" }
orion-msg-topics = { path = "../../core/msg-topics" }
shm-ring = { workspace = true }
orion-wire = { path = "../../core/wire" }
tokio = { workspace = true, features = ["macros", "test-util"] }

# The integration tests, in one binary: one link for the crate, not one for each file
# (tests/all.rs). A test file that needs features says so on its module there.
[[test]]
name = "all"
path = "tests/all.rs"

[lints]
workspace = true
