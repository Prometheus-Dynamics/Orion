[package]
name = "orion-server"
description = "The comm core's server: sessions, bounded queues and deadlines, and dispatch through the one check."
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
orion-check = { path = "../../core/check" }
orion-config = { path = "../../core/config" }
shm-fdpass = { workspace = true }
orion-msg-session = { path = "../../core/msg-session" }
orion-supervise = { path = "../../core/supervise" }
orion-types = { path = "../../core/types" }
orion-wire = { path = "../../core/wire" }
tokio = { workspace = true, features = ["rt", "time", "sync", "macros"] }
tracing.workspace = true

[dev-dependencies]
orion-measure = { path = "../../core/measure", features = ["alloc-counter"] }
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
