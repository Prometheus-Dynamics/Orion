[package]
name = "orion-comm-app"
description = "The comm core, assembled: the always-up program that owns every way into the board."
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[features]
default = ["tcp", "time", "self-status", "proxy", "buffers", "systemd", "node", "outbound", "topic-peers", "ws", "nt4", "nt4-client", "ssh", "ssh-sftp", "ssh-forward", "ssh-sandbox", "recovery", "devices", "shell"]
# The network way in, `orion+tcp`.
tcp = ["dep:orion-tcp"]
# Time sync.
time = ["dep:orion-time"]
# The board's vital signs and Orion's own state as topics.
self-status = ["dep:orion-self-status"]
# Publishing for programs that cannot map shared memory.
proxy = ["dep:orion-broker-proxy"]
# Buffer topics: frames in shared memory.
buffers = ["dep:orion-broker-buffers"]
# Passing records and the rest of what is node logic's to node logic.
node = ["dep:orion-relay"]
# Each device on a link as a resource, with its topics and actions.
devices = ["node", "dep:orion-device-gateway"]
# Samples for subscribers that cannot map a ring: other boards, browsers.
outbound = ["dep:orion-outbound"]
# Other nodes' topics, carried into local copies of their rings.
topic-peers = ["tcp", "dep:orion-topic-peers"]
# The WebSocket way in, for browsers.
ws = ["dep:orion-ws"]
# The SSH way in: logins through the check, a shell as the user.
ssh = ["dep:orion-ssh"]
# The sftp subsystem, for sftp and scp.
ssh-sftp = ["ssh", "dep:orion-ssh-sftp"]
# Local forwarding over SSH: connections from the board for someone who is logged in.
ssh-forward = ["ssh", "orion-ssh/forward", "orion-ssh-sandbox?/forward"]
# What an SSH client sends, read in a child process with no rights.
ssh-sandbox = ["ssh", "dep:orion-ssh-sandbox"]
# A shell on the board over an Orion session, as the account asked for.
shell = ["ssh", "dep:orion-shell"]
# The recovery way in: what is started when the comm core cannot be.
recovery = ["ssh", "dep:orion-recovery", "dep:orion-check"]
# The NT4 gateway: mapped topics as an NT4 server.
nt4 = ["dep:orion-nt4-gateway"]
# The NT4 gateway as a client of an NT4 server somewhere else.
nt4-client = ["dep:orion-nt4-client-gateway"]
# Tells systemd when the comm core is ready and that it is alive.
systemd = []
# Finding the other nodes of the cluster.
discovery = ["tcp", "dep:orion-discovery"]
# Discovery over mDNS on the local network.
mdns = ["discovery", "orion-discovery/mdns"]
# Serial links.
link-serial = ["dep:orion-link-serial"]
# Links brought over the network in the sealed channel.
link-sealed = ["link-serial", "orion-link-serial/sealed"]
# CAN links.
link-can = ["dep:orion-link-can", "orion-link-can/socketcan"]
# USB links.
link-usb = ["link-serial", "dep:orion-link-usb"]
# Everything.
full = ["mdns", "link-sealed", "link-can", "link-usb"]

[dependencies]
orion-broker = { path = "../broker" }
orion-broker-buffers = { path = "../broker-buffers", optional = true }
orion-broker-proxy = { path = "../broker-proxy", optional = true }
orion-check = { path = "../../core/check", optional = true }
orion-config = { path = "../../core/config" }
orion-device-gateway = { path = "../device-gateway", optional = true }
orion-discovery = { path = "../discovery", optional = true }
orion-hello = { path = "../hello" }
orion-keys = { path = "../keys" }
orion-link-can = { path = "../link-can", optional = true }
orion-link-serial = { path = "../link-serial", optional = true }
orion-link-usb = { path = "../link-usb", optional = true }
orion-nt4-client-gateway = { path = "../../gateways/nt4-client-gateway", optional = true }
orion-nt4-gateway = { path = "../../gateways/nt4-gateway", optional = true }
orion-outbound = { path = "../outbound", optional = true }
orion-relay = { path = "../relay", optional = true }
orion-self-status = { path = "../self-status", optional = true }
orion-server = { path = "../server" }
orion-supervise = { path = "../../core/supervise" }
orion-recovery = { path = "../recovery", optional = true }
orion-shell = { path = "../shell", optional = true }
orion-ssh = { path = "../ssh", optional = true }
orion-ssh-sandbox = { path = "../ssh-sandbox", optional = true }
orion-ssh-sftp = { path = "../ssh-sftp", optional = true }
orion-tcp = { path = "../tcp", optional = true }
orion-time = { path = "../time", optional = true }
orion-topic-peers = { path = "../topic-peers", optional = true }
orion-types = { path = "../../core/types" }
orion-unix = { path = "../unix" }
orion-ws = { path = "../ws", optional = true }
tokio = { workspace = true, features = ["rt", "time", "sync", "macros", "signal"] }
tracing.workspace = true

[dev-dependencies]
orion = { path = "../../client/orion", default-features = false, features = ["shell"] }
orion-msg-session = { path = "../../core/msg-session" }
orion-msg-topics = { path = "../../core/msg-topics" }
shm-ring = { workspace = true }
shm-ring-doorbell = { workspace = true }
orion-wire = { path = "../../core/wire" }
rustix = { version = "1", default-features = false, features = ["std", "process"] }
tokio = { workspace = true, features = ["test-util", "net"] }

[[bin]]
name = "orion-comm-helper"
required-features = ["ssh"]

[[test]]
name = "shell"
required-features = ["shell", "recovery"]

[[test]]
name = "recovery"
required-features = ["recovery", "ssh-sftp", "ssh-sandbox"]

[lints]
workspace = true
