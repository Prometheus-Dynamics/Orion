[package]
autotests = false
name = "orion-test-board"
description = "A whole board for a consumer's tests: the real comm core and real node logic, in the test's own process."
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[lib]
# No unit tests in the library: not compiled again to run none (scripts/workspace.py lib-tests).
test = false

[dependencies]
orion = { path = "../../client/orion", features = ["files", "actions", "workloads", "provider"] }
orion-comm-app = { path = "../../comm/comm-app" }
orion-config = { path = "../../core/config" }
orion-node-app = { path = "../../node/node-app" }
orion-scratch = { path = "../scratch" }
tokio = { workspace = true, features = ["rt", "macros", "time", "sync"] }

[lints]
workspace = true

[dev-dependencies]
# Node logic made slow on purpose, for the tests here only: a dev-dependency's features stay out
# of every build but this crate's tests.
orion-node-app = { path = "../../node/node-app", features = ["slow"] }
orion-msg-records = { path = "../../core/msg-records" }
orion-msg-workloads = { path = "../../core/msg-workloads" }
orion-file-store = { path = "../../node/file-store" }
orion-wire = { path = "../../core/wire" }
rustix = { version = "1", default-features = false, features = ["std", "process", "fs"] }

# The integration tests, in one binary (tests/all.rs).
[[test]]
name = "all"
path = "tests/all.rs"
