[package]
name = "orion-sample-executor"
description = "The smallest working executor: each workload is a shell command it runs as a child process."
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[dependencies]
orion = { path = "../../client/orion", features = ["executor"] }
rustix = { version = "1", default-features = false, features = ["std", "process"] }

[dev-dependencies]
orion = { path = "../../client/orion", features = ["executor", "workloads"] }
orion-stubs = { path = "../stubs" }

# Only `src/spawn.rs` uses `unsafe`: a command is made to die with its executor.
[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
unused_lifetimes = "deny"
unused_attributes = "deny"

[lints.clippy]
await_holding_lock = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
