[package]
name = "orion-transport-http"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "HTTP transport adapter for Orion control-plane traffic."
readme = "README.md"

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[features]
# `transport` enables the network client/server (axum, hyper, reqwest, rustls). Without it the
# crate only exposes the protocol layer: payload types, routes, codec, errors and handler traits.
default = ["transport"]
transport = [
    "dep:axum",
    "dep:hyper",
    "dep:hyper-util",
    "dep:reqwest",
    "dep:rustls",
    "dep:tokio",
    "dep:tokio-rustls",
    "orion-transport-common/tls",
]

[dependencies]
orion-auth.workspace = true
orion-control-plane.workspace = true
orion-core.workspace = true
orion-transport-common.workspace = true
axum = { workspace = true, optional = true }
hyper = { workspace = true, optional = true }
hyper-util = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
serde.workspace = true
rkyv.workspace = true
rustls = { workspace = true, optional = true }
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "io-util"], optional = true }
tokio-rustls = { workspace = true, optional = true }

[dev-dependencies]
criterion = { workspace = true, features = ["async_tokio", "cargo_bench_support"] }
rcgen.workspace = true

[[bench]]
name = "http_latency"
harness = false
required-features = ["transport"]
