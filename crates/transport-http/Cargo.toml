[package]
name = "orion-transport-http"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "HTTP transport adapter for Orion control-plane traffic."
readme = "README.md"

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[features]
# Without features the crate only exposes the protocol layer: payload types, routes, codec,
# errors and handler traits.
# - `client`: `HttpClient` + client TLS config (reqwest over rustls). No axum/hyper server stack,
#   so operator tools (orionctl) link only this half.
# - `server`: `HttpServer` + server TLS/client-auth config (axum, hyper, tokio-rustls).
# - `transport`: both halves; kept for compatibility (orion-node and the `orion` facade use it).
default = ["transport"]
transport = ["client", "server"]
client = [
    "dep:http",
    "dep:reqwest",
    "orion-transport-common/tls",
]
server = [
    "dep:axum",
    "dep:http",
    "dep:hyper",
    "dep:hyper-util",
    "dep:rustls",
    "dep:tokio",
    "dep:tokio-rustls",
    "orion-transport-common/tls",
]

[dependencies]
orion-auth = { workspace = true, features = ["std"] }
orion-control-plane = { workspace = true, features = ["std"] }
orion-core = { workspace = true, features = ["std"] }
orion-transport-common.workspace = true
axum = { workspace = true, optional = true }
http = { workspace = true, optional = true }
hyper = { workspace = true, optional = true }
hyper-util = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
serde = { workspace = true, features = ["std"] }
rkyv = { workspace = true, features = ["std"] }
rustls = { workspace = true, optional = true }
thiserror = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "io-util"], optional = true }
tokio-rustls = { workspace = true, optional = true }

[dev-dependencies]
criterion = { workspace = true, features = ["async_tokio", "cargo_bench_support"] }
rcgen.workspace = true

[[bench]]
name = "http_latency"
harness = false
required-features = ["transport"]
