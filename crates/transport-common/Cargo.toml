[package]
name = "orion-transport-common"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Internal shared transport helpers for Orion transport crates."
readme = "README.md"

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[features]
# rustls certificate/key helpers for the TLS-capable transports. IPC-only consumers (and the
# IPC-only orion-node build) leave this off so rustls is not linked.
default = ["tls"]
tls = ["dep:rustls", "dep:rustls-pemfile"]

[dependencies]
rustls = { workspace = true, features = ["ring"], optional = true }
rustls-pemfile = { workspace = true, optional = true }
tokio = { workspace = true, features = ["rt"] }
