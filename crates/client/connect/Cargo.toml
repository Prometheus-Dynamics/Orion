[package]
name = "orion-connect"
description = "The client's connection: one session and one way back to it, on the board's socket, the network or a link."
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[features]
default = []
# Waiting for the session inside a tokio runtime instead of blocking a thread.
tokio = ["dep:tokio"]

[dependencies]
orion-identity = { path = "../../core/identity" }
orion-msg-session = { path = "../../core/msg-session" }
orion-net-handshake = { path = "../../core/net-handshake" }
orion-supervise = { path = "../../core/supervise" }
orion-types = { path = "../../core/types" }
orion-wire = { path = "../../core/wire", features = ["std"] }
tokio = { workspace = true, features = ["net", "time"], optional = true }

# The board's own socket, descriptors with frames, serial ports and waiting with `poll`.
[target.'cfg(target_os = "linux")'.dependencies]
shm-fdpass = { workspace = true }
rustix = { version = "1", default-features = false, features = ["std", "event", "termios", "fs", "pipe"] }

# The tests that need a comm core run on Linux, where it is.
[target.'cfg(target_os = "linux")'.dev-dependencies]
orion-hello = { path = "../../comm/hello" }
orion-keys = { path = "../../comm/keys" }
orion-link-serial = { path = "../../comm/link-serial" }
orion-measure = { path = "../../core/measure", features = ["alloc-counter"] }
orion-server = { path = "../../comm/server" }
orion-stubs = { path = "../../testing/stubs" }
orion-tcp = { path = "../../comm/tcp" }
orion-unix = { path = "../../comm/unix" }
rustix = { version = "1", default-features = false, features = ["std", "pty"] }
tokio = { workspace = true, features = ["rt", "macros", "net", "time", "sync"] }

[lints]
workspace = true
