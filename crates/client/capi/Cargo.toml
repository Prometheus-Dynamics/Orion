[package]
autotests = false
name = "orion-capi"
description = "A small versioned C surface over the Orion client: connect, publish, subscribe."
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lib]
name = "orion_c"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
orion = { path = "../orion", default-features = false, features = ["topics"] }

# The tests that need a comm core run on Linux, where it is.
[target.'cfg(target_os = "linux")'.dev-dependencies]
orion-stubs = { path = "../../testing/stubs" }

[lints.rust]
unsafe_code = "allow"
unsafe_op_in_unsafe_fn = "deny"

# The integration tests, in one binary: one link for the crate, not one for each file
# (tests/all.rs). A test file that needs features says so on its module there.
[[test]]
name = "all"
path = "tests/all.rs"
