[package]
name = "orion-provider"
description = "The client's provider role: say a thing exists, with its topics and its actions, so anything can find and use it."
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
orion-actions = { path = "../actions" }
orion-connect = { path = "../connect" }
orion-msg-records = { path = "../../core/msg-records" }
orion-msg-topics = { path = "../../core/msg-topics" }
orion-records = { path = "../records" }
orion-topics = { path = "../topics" }
orion-types = { path = "../../core/types" }
orion-wire = { path = "../../core/wire" }

# The tests that need a comm core run on Linux, where it is.
[target.'cfg(target_os = "linux")'.dev-dependencies]
shm-ring = { workspace = true }
orion-stubs = { path = "../../testing/stubs" }

[lints]
workspace = true
