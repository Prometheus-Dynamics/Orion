[package]
autotests = false
name = "orion-topics"
description = "The client's topics: publish and subscribe with the same calls wherever the comm core is."
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
orion-connect = { path = "../connect" }
orion-msg-topics = { path = "../../core/msg-topics" }
shm-ring = { workspace = true }
shm-ring-time = { workspace = true }
orion-types = { path = "../../core/types" }
orion-wire = { path = "../../core/wire" }

# Rings shared on the board, and the doorbell a subscriber sleeps on.
[target.'cfg(target_os = "linux")'.dependencies]
shm-ring-doorbell = { workspace = true }
rustix = { version = "1", default-features = false, features = ["std", "event"] }

# The tests that need a comm core run on Linux, where it is.
[target.'cfg(target_os = "linux")'.dev-dependencies]
orion-broker = { path = "../../comm/broker" }
orion-broker-proxy = { path = "../../comm/broker-proxy" }
orion-keys = { path = "../../comm/keys" }
orion-measure = { path = "../../core/measure", features = ["alloc-counter", "sched"] }
orion-scratch = { path = "../../testing/scratch" }
orion-server = { path = "../../comm/server" }
orion-tcp = { path = "../../comm/tcp" }
orion-unix = { path = "../../comm/unix" }
tokio = { workspace = true, features = ["rt", "macros", "net", "time", "sync"] }

# The integration tests, in one binary: one link for the crate, not one for each file
# (tests/all.rs). A test file that needs features says so on its module there.
[[test]]
name = "all"
path = "tests/all.rs"

[lints]
workspace = true
