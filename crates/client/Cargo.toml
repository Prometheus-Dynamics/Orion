[package]
name = "orion-client"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Rust client SDK for talking to the Orion daemon."
readme = "README.md"

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[features]
default = ["ipc"]
ipc = ["dep:orion-transport-ipc"]
# Remote operator client (`orion_client::remote`, docs/remote-operator.md): an ed25519 operator
# identity, enrollment, and signed `orion+tcp` requests to nodes, without running orion-node.
# Pulls in no HTTP stack (only the protocol layer of orion-transport-http) and no node internals.
# Cross-platform (Linux, macOS, Windows) when built with `--no-default-features`: it only uses
# the platform-neutral framing and TCP client of orion-transport-ipc. `ipc` stays Unix-only.
remote = [
    "dep:ed25519-dalek",
    "dep:orion-auth",
    "dep:orion-transport-http",
    "dep:orion-transport-ipc",
    "dep:getrandom",
    "orion-auth/enrollment",
]
# Browse `_orion._tcp` nodes with mDNS (`orion_client::remote::discovery`).
discovery = ["remote", "dep:mdns-sd"]

[dependencies]
ed25519-dalek = { workspace = true, optional = true }
mdns-sd = { workspace = true, optional = true }
orion-auth = { workspace = true, features = ["std"], optional = true }
orion-core = { workspace = true, features = ["std"] }
orion-control-plane = { workspace = true, features = ["std"] }
orion-runtime = { workspace = true, features = ["std"] }
orion-transport-http = { workspace = true, optional = true }
orion-transport-ipc = { workspace = true, optional = true }
getrandom = { workspace = true, optional = true }
serde = { workspace = true, features = ["std"] }
thiserror = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "fs", "sync", "time"] }

# Only the local IPC examples (unix, feature `ipc`) use the HTTP transport. Keeping it off other
# targets lets the `remote` example build on Windows without a C toolchain for ring.
[target.'cfg(unix)'.dev-dependencies]
orion-transport-http = { workspace = true, features = ["transport"] }

# The local IPC examples need the default `ipc` feature.
[[example]]
name = "assigned_workloads_watch"
required-features = ["ipc"]

[[example]]
name = "camera_pipeline_publish"
required-features = ["ipc"]

[[example]]
name = "camera_provider_publish"
required-features = ["ipc"]

[[example]]
name = "control_plane_watch"
required-features = ["ipc"]

[[example]]
name = "control_plane_write_watch"
required-features = ["ipc"]

[[example]]
name = "device_agent"
required-features = ["ipc"]

[[example]]
name = "executor_register_and_watch"
required-features = ["ipc"]

[[example]]
name = "executor_watch"
required-features = ["ipc"]

[[example]]
name = "multi_watch"
required-features = ["ipc"]

[[example]]
name = "provider_register_and_watch"
required-features = ["ipc"]

[[example]]
name = "provider_watch"
required-features = ["ipc"]

[[example]]
name = "remote_operator"
required-features = ["remote"]
