[package]
name = "orion-file-roots"
description = "The directories an image lets clients reach, as files to fetch, push, list, remove and rename, and nothing outside them."
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
orion-check = { path = "../../core/check" }
orion-config = { path = "../../core/config" }
orion-connect = { path = "../../client/connect" }
orion-file-store = { path = "../file-store" }
orion-msg-actions = { path = "../../core/msg-actions" }
orion-msg-files = { path = "../../core/msg-files" }
orion-reply = { path = "../reply" }
orion-types = { path = "../../core/types" }
orion-wire = { path = "../../core/wire" }
rustix = { version = "1", default-features = false, features = ["std", "fs"] }
sha2 = { version = "0.11.0", default-features = false }
tracing.workspace = true

[dev-dependencies]
orion-scratch = { path = "../../testing/scratch" }

[lints]
workspace = true
