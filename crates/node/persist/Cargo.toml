[package]
name = "orion-persist"
description = "Keeping the record store across restarts: one snapshot, replaced atomically, never able to stop start-up."
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lib]
# No unit tests in the library: not compiled again to run none (scripts/workspace.py lib-tests).
test = false

[dependencies]
orion-msg-records = { path = "../../core/msg-records" }
orion-store = { path = "../store" }
orion-wire = { path = "../../core/wire" }
tracing.workspace = true

[dev-dependencies]
orion-scratch = { path = "../../testing/scratch" }
orion-types = { path = "../../core/types" }

[lints]
workspace = true
