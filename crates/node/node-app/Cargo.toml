[package]
name = "orion-node-app"
description = "Node logic, assembled: the comm core's first client, which keeps the records and answers for them."
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
orion-config = { path = "../../core/config" }
orion-connect = { path = "../../client/connect", features = ["tokio"] }
orion-msg-records = { path = "../../core/msg-records" }
orion-msg-session = { path = "../../core/msg-session" }
orion-persist = { path = "../persist" }
orion-store = { path = "../store" }
orion-types = { path = "../../core/types" }
orion-wire = { path = "../../core/wire", features = ["std"] }
tokio = { workspace = true, features = ["rt", "time", "sync", "macros", "signal"] }
tracing.workspace = true

[dev-dependencies]
orion = { path = "../../client/orion" }
orion-stubs = { path = "../../testing/stubs" }
tokio = { workspace = true, features = ["rt", "sync", "macros"] }

[lints]
workspace = true
