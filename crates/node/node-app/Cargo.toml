[package]
name = "orion-node-app"
description = "Node logic, assembled: the comm core's first client, which keeps the records and answers for them."
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[features]
default = ["pull"]
# Fetching a file from a URL. This brings in the one HTTP client, and rustls.
pull = ["dep:orion-files-pull"]

[dependencies]
orion-action-forward = { path = "../action-forward" }
orion-action-list = { path = "../action-list" }
orion-audit = { path = "../audit" }
orion-check = { path = "../../core/check" }
orion-config = { path = "../../core/config" }
orion-dial = { path = "../dial" }
orion-connect = { path = "../../client/connect", features = ["tokio"] }
orion-executors = { path = "../executors" }
orion-file-store = { path = "../file-store" }
orion-files-pull = { path = "../files-pull", optional = true }
orion-files-sink = { path = "../files-sink" }
orion-msg-actions = { path = "../../core/msg-actions" }
orion-msg-files = { path = "../../core/msg-files" }
orion-msg-peers = { path = "../../core/msg-peers" }
orion-msg-records = { path = "../../core/msg-records" }
orion-msg-session = { path = "../../core/msg-session" }
orion-msg-topics = { path = "../../core/msg-topics" }
orion-msg-workloads = { path = "../../core/msg-workloads" }
orion-peer-links = { path = "../peer-links" }
orion-persist = { path = "../persist" }
orion-reply = { path = "../reply" }
orion-resources = { path = "../resources" }
orion-ring = { path = "../../core/ring" }
orion-store = { path = "../store" }
orion-sync = { path = "../sync" }
orion-topics = { path = "../../client/topics" }
orion-types = { path = "../../core/types", features = ["now"] }
orion-wire = { path = "../../core/wire", features = ["std"] }
sha2 = { version = "0.11.0", default-features = false }
tokio = { workspace = true, features = ["rt", "time", "sync", "macros", "signal", "net"] }
tracing.workspace = true

[dev-dependencies]
orion = { path = "../../client/orion", features = ["files", "provider", "workloads", "executor"] }
orion-ctl = { path = "../../client/ctl" }
orion-sample-executor = { path = "../../testing/sample-executor" }
orion-stubs = { path = "../../testing/stubs" }
sha2 = { version = "0.11.0", default-features = false }
tokio = { workspace = true, features = ["rt", "sync", "macros"] }

[lints]
workspace = true
