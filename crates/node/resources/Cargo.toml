[package]
autotests = false
name = "orion-resources"
description = "Resources: the things that exist on a board, who offers them, and who holds them."
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
orion-msg-records = { path = "../../core/msg-records" }
orion-store = { path = "../store" }
orion-types = { path = "../../core/types" }
orion-wire = { path = "../../core/wire" }

# The integration tests, in one binary: one link for the crate, not one for each file
# (tests/all.rs). A test file that needs features says so on its module there.
[[test]]
name = "all"
path = "tests/all.rs"

[lints]
workspace = true
