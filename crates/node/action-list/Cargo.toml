[package]
autotests = false
name = "orion-action-list"
description = "The open list of actions: any program adds its own, and runs are handed to whoever added them."
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lib]
# No unit tests in the library: not compiled again to run none (scripts/workspace.py lib-tests).
test = false

[dependencies]
orion-check = { path = "../../core/check" }
orion-msg-actions = { path = "../../core/msg-actions" }
orion-reply = { path = "../reply" }
orion-types = { path = "../../core/types" }
orion-wire = { path = "../../core/wire" }

[dev-dependencies]

# The integration tests, in one binary: one link for the crate, not one for each file
# (tests/all.rs). A test file that needs features says so on its module there.
[[test]]
name = "all"
path = "tests/all.rs"

[lints]
workspace = true
