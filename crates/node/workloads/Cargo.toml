[package]
autotests = false
name = "orion-workloads"
description = "The workload tracker: what should run, where each run is, and when to start it again."
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
orion-msg-workloads = { path = "../../core/msg-workloads" }
orion-types = { path = "../../core/types" }

[dev-dependencies]
orion-wire = { path = "../../core/wire" }

# The integration tests, in one binary: one link for the crate, not one for each file
# (tests/all.rs). A test file that needs features says so on its module there.
[[test]]
name = "all"
path = "tests/all.rs"

[lints]
workspace = true
