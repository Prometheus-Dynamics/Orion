[package]
name = "orion-node"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Thin Orion node binary."
readme = "README.md"

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "orion-node"
path = "src/main.rs"

[features]
# Release binaries enable the HTTP control plane (peer sync, HTTP probe, HTTP TLS bootstrap), TCP
# peer sync and both data-plane transports by default. `--no-default-features` produces an IPC-only
# node (no axum/hyper/reqwest/rustls); add back any of `transport-http`, `peer-tcp`,
# `transport-tcp` or `transport-quic` independently.
default = ["transport-http", "transport-tcp", "transport-quic", "peer-tcp"]
transport-http = ["orion-transport-http/transport", "orion-transport-common/tls", "dep:rcgen"]
# Peer sync over plain TCP (`orion+tcp://` peers, `ORION_NODE_PEER_ADDR` listener) with ed25519
# signed requests and responses. Needs only tokio, so `--no-default-features --features peer-tcp`
# gives an IPC-only appliance build that can still cluster. See docs/peer-sync.md.
peer-tcp = []
transport-tcp = ["dep:orion-transport-tcp"]
transport-quic = ["dep:orion-transport-quic"]
# Opt-in global allocators for the `orion-node` binary only (the library never sets one). Both are
# off by default so the binary uses the platform allocator (glibc malloc on Linux). They are meant
# to be enabled one at a time; if both are enabled (for example by `--all-features`), jemalloc takes
# precedence and mimalloc is compiled but unused. See docs/node-env.md.
# Serves microcontroller links (serial and SocketCAN, Linux only) and bridges each device into the
# node as a provider. Opt-in; configured with ORION_NODE_LINKS. See docs/link-protocol.md.
link-gateway = ["dep:orion-link"]
alloc-mimalloc = ["dep:mimalloc"]
alloc-jemalloc = ["dep:tikv-jemallocator"]

[dependencies]
ed25519-dalek = { workspace = true, features = ["std"] }
libc.workspace = true
mimalloc = { workspace = true, optional = true }
orion-auth = { workspace = true, features = ["std"] }
orion-control-plane = { workspace = true, features = ["std"] }
orion-core = { workspace = true, features = ["std"] }
orion-data-plane = { workspace = true, features = ["std"] }
orion-link = { workspace = true, features = ["std"], optional = true }
orion-runtime = { workspace = true, features = ["std"] }
orion-service.workspace = true
orion-transport-common.workspace = true
orion-transport-http.workspace = true
orion-transport-ipc.workspace = true
orion-transport-quic = { workspace = true, optional = true }
orion-transport-tcp = { workspace = true, optional = true }
rand_core.workspace = true
rcgen = { workspace = true, optional = true }
rkyv = { workspace = true, features = ["std"] }
serde = { workspace = true, features = ["std"] }
serde_json = { workspace = true, features = ["std"] }
thiserror = { workspace = true, features = ["std"] }
tikv-jemallocator = { workspace = true, optional = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "time", "sync", "signal", "io-util", "fs"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
criterion = { workspace = true, features = ["async_tokio", "cargo_bench_support"] }
orion = { workspace = true, features = ["auth", "client", "runtime", "macros", "transport-http", "transport-tcp", "transport-quic", "transport-ipc"] }
orion-macros.workspace = true
rcgen.workspace = true
reqwest.workspace = true

[[example]]
name = "link_device_sim"
required-features = ["link-gateway"]

