[[test]]
name = "docker_client_examples"
required-features = ["transport-http"]

[[test]]
name = "docker_client_orionctl_examples"
required-features = ["transport-http"]

[[test]]
name = "docker_cluster_adversarial"
required-features = ["transport-http"]

[[test]]
name = "docker_cluster_baseline"
required-features = ["transport-http"]

[[test]]
name = "docker_cluster_failure"
required-features = ["transport-http"]

[[test]]
name = "docker_cluster_perf"
required-features = ["transport-http"]

[[test]]
name = "docker_cluster_scale"
