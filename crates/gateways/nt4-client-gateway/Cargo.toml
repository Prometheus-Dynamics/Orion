[package]
name = "orion-nt4-client-gateway"
description = "Topics to NetworkTables 4 and back, as a client of an NT4 server somewhere else."
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[dependencies]
orion-broker = { path = "../../comm/broker" }
orion-config = { path = "../../core/config" }
orion-nt4 = { path = "../nt4", default-features = false, features = ["client"] }
orion-nt4-gateway = { path = "../nt4-gateway" }
tokio = { workspace = true, features = ["rt", "time", "sync", "macros"] }
tracing.workspace = true

[dev-dependencies]
orion = { path = "../../client/orion" }
orion-comm-app = { path = "../../comm/comm-app" }
orion-nt4 = { path = "../nt4" }
tokio = { workspace = true, features = ["rt", "time", "macros", "sync", "net"] }

[lints]
workspace = true
