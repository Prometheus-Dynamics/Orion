[package]
name = "orion-auth"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Authentication protocol contracts for Orion."
readme = "README.md"

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[features]
# `std` is on by default. Without it the crate is `no_std` + `alloc`.
default = ["std"]
std = [
    "orion-control-plane/std",
    "orion-core/std",
    "rkyv/std",
    "serde/std",
    "thiserror/std",
]

[dependencies]
orion-control-plane.workspace = true
orion-core.workspace = true
rkyv.workspace = true
serde.workspace = true
thiserror.workspace = true
