[package]
name = "orion-auth"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Authentication protocol contracts for Orion."
readme = "README.md"

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[features]
# `std` is on by default. Without it the crate is `no_std` + `alloc`.
default = ["std"]
std = [
    "orion-control-plane/std",
    "orion-core/std",
    "rkyv/std",
    "serde/std",
    "thiserror/std",
]
# ed25519 signing/verification of peer requests and `orion+tcp` responses, and key fingerprints
# (`crypto` module). Shared by orion-node and the remote operator client in orion-client.
crypto = ["dep:ed25519-dalek", "dep:sha2"]
# Shared-key enrollment handshake proofs (HMAC-SHA256, `enrollment` module).
enrollment = ["crypto", "dep:hmac"]
# The remote link channel (`link_channel` module): an ed25519-signed X25519 handshake, then
# ChaCha20-Poly1305 records. Shared by orion-node's `tcp:` links and remote link clients.
link-channel = [
    "crypto",
    "dep:chacha20poly1305",
    "dep:curve25519-dalek",
    "dep:hmac",
    "dep:zeroize",
]

[dependencies]
chacha20poly1305 = { workspace = true, optional = true }
curve25519-dalek = { workspace = true, optional = true }
ed25519-dalek = { workspace = true, optional = true }
hmac = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
orion-control-plane.workspace = true
orion-core.workspace = true
rkyv.workspace = true
serde.workspace = true
thiserror.workspace = true
zeroize = { workspace = true, optional = true }

[[example]]
name = "link_channel_cost"
required-features = ["link-channel"]
