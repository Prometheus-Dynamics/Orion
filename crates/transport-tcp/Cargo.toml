[package]
name = "orion-transport-tcp"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "TCP transport adapter for Orion data-plane traffic."
readme = "README.md"

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[features]
# TLS and mTLS over TCP (rustls). Off, the crate carries only plaintext frames and links no rustls.
tls = ["dep:rustls", "dep:tokio-rustls", "orion-transport-common/tls"]

[dependencies]
orion-data-plane = { workspace = true, features = ["std"] }
orion-core = { workspace = true, features = ["std"] }
orion-transport-common.workspace = true
serde = { workspace = true, features = ["std"] }
rkyv = { workspace = true, features = ["std"] }
thiserror = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "io-util", "sync", "time"] }
rustls = { workspace = true, features = ["ring"], optional = true }
tokio-rustls = { workspace = true, optional = true }

[dev-dependencies]
criterion = { workspace = true, features = ["async_tokio", "cargo_bench_support"] }
rcgen.workspace = true

[[bench]]
name = "tcp_perf"
harness = false
