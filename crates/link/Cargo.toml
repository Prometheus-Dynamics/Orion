[package]
name = "orion-link"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "no_std link protocol for connecting microcontrollers to Orion: framing (CRC-32C, COBS, CAN/CAN FD), typed messages, and sans-IO device/host sessions."
readme = "README.md"
keywords = ["no-std", "embedded", "cobs", "can", "framing"]
categories = ["embedded", "no-std", "encoding"]

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[features]
# The default build is the no_std, allocation-free framing layer only.
default = []
# The minimal device path: the hand-written postcard-compatible codec with borrowed views (`wire`)
# and the sans-IO device session (`device`). No allocator, no dependencies.
device = []
# Typed link messages (postcard + serde over the shared Orion records) and record conveniences on
# the device session. Still no_std; needs a global allocator. Implies `device`.
alloc = ["device", "dep:orion-core", "dep:orion-control-plane", "dep:postcard", "dep:serde"]
# The sans-IO host session (`host`) and `std::error::Error` impls. Implies `alloc`.
std = [
    "alloc",
    "orion-core/std",
    "orion-control-plane/std",
    "postcard/use-std",
    "serde/std",
    "embedded-io?/std",
    "embedded-io-async?/std",
]
# 256-entry CRC-32C table (1 KiB of flash) instead of the 16-entry nibble table (64 bytes).
crc-table = []
# Blocking byte-stream adapters over `embedded_io::{Read, BufRead, Write}`.
embedded-io = ["dep:embedded-io"]
# Async byte-stream adapters over `embedded_io_async::{Read, BufRead, Write}`.
embedded-io-async = ["dep:embedded-io-async"]
# Conversions between link segments and `embedded_can::Frame`s.
embedded-can = ["dep:embedded-can"]

[dependencies]
orion-core = { workspace = true, optional = true }
orion-control-plane = { workspace = true, optional = true }
postcard = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
embedded-can = { version = "0.4", optional = true }
embedded-io = { version = "0.7", optional = true }
embedded-io-async = { version = "0.7", optional = true }

[dev-dependencies]
orion-control-plane.workspace = true
orion-core.workspace = true

[[example]]
name = "sim_device"
required-features = ["std"]
