[package]
name = "orion-link"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "no_std link protocol for connecting microcontrollers to Orion: framing (CRC-32C, COBS, CAN/CAN FD), typed messages, and sans-IO device/host sessions."
readme = "README.md"
keywords = ["no-std", "embedded", "cobs", "can", "framing"]
categories = ["embedded", "no-std", "encoding"]

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[features]
# The default build is the no_std, allocation-free framing layer, plus the session counters of
# the device session (`stats`; they take no RAM or code unless `device` is enabled).
default = ["stats"]
# The minimal device path: the hand-written postcard-compatible codec with borrowed views (`wire`)
# and the sans-IO device session (`device`). No allocator, no dependencies.
device = []
# Device-side actions (protocol 1): one `ActionRequest` in flight, its result reports, and the
# `ActionRequested` event. Adds one receive-sized buffer and a few bytes of state to the device
# session; off, the minimal device build is unchanged.
actions = ["device"]
# Device-side streams (interface revision 2): one declared stream, its batches and the host's
# demand. Adds two transmit-sized buffers to the device session; off, nothing changes.
streams = ["device"]
# Firmware transfer over the link (kinds 0x20-0x28): the device session's transfer state,
# `DeviceInfo`, and the host driver. Needs `device`; the sink trait and the wire types are always
# compiled, and dead-stripped where unused.
xfer = ["device"]
# Device session counters (`device::DeviceStats`, `DeviceSession::stats`). Off, the counters cost
# no RAM (about 56 bytes on 32-bit targets) and no flash (about 100 bytes).
stats = []
# Typed link messages (postcard + serde over the shared Orion records) and record conveniences on
# the device session. Still no_std; needs a global allocator. Implies `device`.
alloc = ["device", "dep:orion-core", "dep:orion-control-plane", "dep:postcard", "dep:serde"]
# The sans-IO host session (`host`) and `std::error::Error` impls. Implies `alloc`.
std = [
    "alloc",
    "stats",
    "orion-core/std",
    "orion-control-plane/std",
    "postcard/use-std",
    "serde/std",
    "embedded-io?/std",
    "embedded-io-async?/std",
]
# 256-entry CRC-32C table (1 KiB of flash) instead of the 16-entry nibble table (64 bytes).
crc-table = []
# A bare-metal firmware supplies the CRC-32C routine (`orion_link_crc32c_update`), for example
# over a CRC peripheral. Only on `target_os = "none"`; on hosted targets it does nothing, so
# `--all-features` builds link. Hosts need nothing: the ARMv8 CRC and x86-64 SSE4.2 instructions
# are used when the target has them, or when detected at run time with `std`.
crc-extern = []
# Blocking byte-stream adapters over `embedded_io::{Read, BufRead, Write}`.
embedded-io = ["dep:embedded-io"]
# Async byte-stream adapters over `embedded_io_async::{Read, BufRead, Write}`.
embedded-io-async = ["dep:embedded-io-async"]
# Conversions between link segments and `embedded_can::Frame`s.
embedded-can = ["dep:embedded-can"]

[dependencies]
orion-core = { workspace = true, optional = true }
orion-control-plane = { workspace = true, optional = true }
postcard = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
embedded-can = { version = "0.4", optional = true }
embedded-io = { version = "0.7", optional = true }
embedded-io-async = { version = "0.7", optional = true }

[dev-dependencies]
orion-control-plane.workspace = true
orion-core.workspace = true

[[example]]
name = "sim_device"
required-features = ["std"]
