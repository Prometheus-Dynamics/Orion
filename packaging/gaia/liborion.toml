# liborion, the C library, for images whose programs load it: optional Gaia layer (Gaia >= 2.0.5).
#
# Import it after orion-node.toml, from the same pinned Orion source:
#
#   imports = [
#     ...base layers...,
#     { source = "orion", path = "packaging/gaia/orion-node.toml" },
#     { source = "orion", path = "packaging/gaia/liborion.toml" },
#   ]
#
# A separate layer for the same reason as orionctl.toml: Gaia builds every declared artifact, so
# images that do not import this file never build the library.
#
# Builds liborion.so for aarch64-unknown-linux-gnu in the same cross image as orion-node and
# installs it as /usr/lib/liborion.so.1 (its SONAME). `surface` makes Gaia check the library's
# dynamic exports against crates/capi/symbols.txt: a build where a symbol leaks or goes missing
# fails. Once a program in the image loads liborion.so.1, `gaia image:check` also checks its
# imports against the same list.

config = 3
gaia_version = ">=2.0.5-dev"

[providers.rust]
allow_nested_build = true

[[artifacts]]
id = "liborion"
kind = "rust"
source = "orion"
package = "liborion"
target = "aarch64-unknown-linux-gnu"
profile = "release"
target_name = "liborion.so"
install_name = "liborion.so.1"
install_class = "library"
install_dest_hint = "/usr/lib/liborion.so.1"
output_path = "${outputs.dir}/artifacts/liborion/liborion.so"
surface = { exports = "crates/capi/symbols.txt" }

[artifacts.execution]
backend = "docker"

[artifacts.execution.docker]
image = "orion-aarch64-cross"
dockerfile = "${self}/docker/aarch64-cross.Dockerfile"
context = "${self}/docker"

[[install]]
id = "install-liborion"
artifact = "liborion"
dest = "/usr/lib/liborion.so.1"
replace = true
mode = 420 # 0644

# Same image kind as orion-node.toml (Gaia requires it next to a feed list); feed lists merge.
[image]
kind = "buildroot"

[image.feed]
install_entries = ["install-liborion"]
