# `scripts/capi.sh header` writes include/orion_mcu.h from this; CI checks it is current.
language = "C"
include_guard = "ORION_MCU_H"
include_version = false
no_includes = true
sys_includes = ["stdbool.h", "stddef.h", "stdint.h"]
cpp_compat = true
documentation = true
documentation_style = "c"
style = "type"
usize_is_size_t = true
autogen_warning = "/* Generated by cbindgen from examples/mcu-template (scripts/capi.sh header). Do not edit. */"
header = """/*
 * The Orion MCU template's C API (examples/mcu-template/README.md). Link
 * liborion_mcu_template.a and call it from one main loop, not from interrupts. Define
 * ORION_MCU_UART (the default build, feature ffi-uart) or ORION_MCU_CAN (feature ffi-can) to
 * match the library; ORION_MCU_XFER and ORION_MCU_SLOTS as well for feature ffi-slots.
 *
 * At start-up, check orion_api_version() >> 16 == ORION_MCU_API_MAJOR and
 * (orion_api_version() & 0xffff) >= ORION_MCU_API_MINOR.
 */"""

[defines]
"feature = ffi-uart" = "ORION_MCU_UART"
"feature = ffi-can" = "ORION_MCU_CAN"
"feature = ffi-slots" = "ORION_MCU_SLOTS"
"feature = xfer" = "ORION_MCU_XFER"

[export]
# Only the C API's own items.
item_types = ["constants", "functions"]
exclude = ["RX", "TX", "SLOTS", "MAX_VERSION_BYTES", "MAX_NOTE_BYTES", "MAX_CHUNK", "NO_SLOT", "RECORD_LEN", "BODY_LEN"]

[export.rename]
"NAME_CAPACITY" = "ORION_NAME_CAPACITY"

[parse]
parse_deps = false
