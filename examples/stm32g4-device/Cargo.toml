[package]
name = "orion-stm32g4-device"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT OR Apache-2.0"
publish = false
description = "An STM32G4 device that speaks the Orion link over FDCAN or UART and publishes one record and one stream."

# Standalone: not a member of the Orion workspace (listed in the workspace `exclude`), with its own
# lockfile. Build with `cargo build --release` from this directory (the target is set in
# `.cargo/config.toml`).
[workspace]

[features]
default = ["link-can", "small-mem"]
# The Orion link over FDCAN1 (PA11 RX, PA12 TX), CAN FD frames at 500 kbit/s nominal and 2 Mbit/s
# data.
link-can = []
# The Orion link over USART2 (PA2 TX, PA3 RX) at 115200 baud, the board's ST-LINK virtual COM port
# on a Nucleo-G431.
link-uart = []
# Byte-loop mem* routines instead of compiler-builtins' unrolled ones: about 1 KiB less flash.
small-mem = []
# The link's CRC-32C on the chip's CRC unit instead of the software nibble table.
hw-crc = ["orion-link/crc-extern"]

[dependencies]
# `device`: the firmware supplies the interrupt vectors itself (one unused entry, see main.rs) instead
# of cortex-m-rt's default table of 240.
cortex-m-rt = { version = "0.7.5", features = ["device"] }
orion-link = { path = "../../crates/link", default-features = false, features = ["device", "streams"] }

[profile.dev]
panic = "abort"
opt-level = "s"

[profile.release]
panic = "abort"
opt-level = "z"
lto = true
codegen-units = 1
debug = false
