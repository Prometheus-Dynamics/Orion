name: Next

# A measurement branch (diag/keys-cpu): where the lane keys' self-test's CPU goes on CI's runner.
# Dispatched by hand only; it never runs on a push.
on:
  workflow_dispatch:

jobs:
  keys-cpu:
    name: keys self-test CPU
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: main-${{ hashFiles('Cargo.toml', '.cargo/config.toml', 'rust-toolchain.toml') }}
          save-if: false
      - name: the runner
        run: |
          nproc; python3 --version; git --version; cargo -V; rustc -V
          python3 - <<'PY'
          import importlib.util, os, shutil, sys
          spec = importlib.util.spec_from_file_location("lr", "scripts/lane-reuse.py")
          m = importlib.util.module_from_spec(spec); sys.argv = ["x"]; spec.loader.exec_module(m)
          for name in m.PROGRAMS:
              path = shutil.which(name)
              if path:
                  real = os.path.realpath(path)
                  print(f"{name}: {path} -> {real} {os.path.getsize(real)} bytes")
          PY
      - name: one key, profiled
        run: |
          cargo metadata --locked --format-version 1 > /dev/null
          /usr/bin/time -f '%e s wall %U+%S CPU' python3 -c "
          import cProfile, pstats, runpy, sys
          sys.argv = ['scripts/lane-reuse.py', '--explain', 'tests', 'orion-ctl']
          profile = cProfile.Profile(); profile.enable()
          try:
              runpy.run_path('scripts/lane-reuse.py', run_name='__main__')
          except SystemExit:
              pass
          profile.disable()
          pstats.Stats(profile, stream=sys.stderr).sort_stats('cumulative').print_stats(25)
          " > /dev/null
      - name: the self-test, three times
        run: |
          for run in 1 2 3; do
            /usr/bin/time -f "run $run: %e s wall, %U+%S CPU" python3 scripts/lane-reuse.py --self-test | grep -E 'CPU:|passed|FAILED'
          done
