name: Next

on:
  push:
    branches:
      - next
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE-*"
  pull_request:
    branches:
      - next
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The gate, in its parts, each on a runner of its own and at once: on one runner its lanes
  # share the runner's few cores with clippy and the tests. Together the parts are the whole gate.
  gate:
    strategy:
      fail-fast: false
      matrix:
        part: [main, clippy, shipped, matrix, other-systems, size, devices]
    name: gate (${{ matrix.part }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # rust-toolchain.toml selects the toolchain and its components.
      - uses: dtolnay/rust-toolchain@stable
      # A cache for each part: each builds in target directories of its own. rust-cache's own key
      # does not see the root manifest's profiles: a change to one matched the cache whole, so it
      # was never saved again and the builds it held no longer fit.
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.part }}-${{ hashFiles('Cargo.toml', '.cargo/config.toml', 'rust-toolchain.toml') }}
      # The gate runs each test in a process of its own with cargo-nextest where it is installed,
      # as on a worker's machine; without it, cargo test runs the same cases one binary at a time.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      # Ubuntu's AppArmor gives a user namespace made by an unconfined program no capabilities,
      # and the sandbox test that checks what each kind of session holds needs them in one of
      # its own. The test of ways in kept to interfaces makes dummy interfaces in a network
      # namespace of its own, and a namespace cannot load the module. The gate fails such a
      # test that could not run. This runner is the tests', and thrown away after.
      - run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          sudo modprobe dummy
      # The test of a sandbox that refuses openat2 loads its filter with bwrap, and the gate
      # fails it where it cannot run.
      - run: command -v bwrap || sudo apt-get install -y --no-install-recommends bubblewrap
      # CI measures every size build, whatever its key says, and checks each against the record
      # its key has (scripts/size-gate.sh): the run that finds a key missing an input.
      - run: ./scripts/gate.sh --part ${{ matrix.part }}
        env:
          SIZE_GATE_MEASURE: "1"

  # The client on the systems it is built for besides Linux: built, and its tests run. The tests
  # that need a comm core are Linux's; what runs here is the rest.
  client:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('Cargo.toml', '.cargo/config.toml', 'rust-toolchain.toml') }}
      - shell: bash
        run: >
          cargo test --all-features
          -p orion-connect -p orion-topics -p orion-records -p orion-actions -p orion-files
          -p orion-executor -p orion-provider -p orion-ctl -p orion-capi -p orion
