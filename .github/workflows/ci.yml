name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0 # keep in sync with rust-toolchain.toml
          components: rustfmt, clippy

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: fmt, file sizes, workspace tests (scripts/ci-jobs.sh workspace)
        run: ./scripts/ci-jobs.sh workspace

  docs-and-lints:
    # Clippy everywhere, the orion-node / orionctl / transport-http / remote-client feature matrix,
    # the orion-node test builds the all-features run cannot stand for, and the docs. The matrix
    # and what it deliberately leaves out are documented in docs/development.md ("CI jobs").
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0 # keep in sync with rust-toolchain.toml
          components: rustfmt, clippy

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Lints, feature matrix, docs (scripts/ci-jobs.sh lints)
        run: ./scripts/ci-jobs.sh lints

  remote-client-cross-check:
    # The remote operator client is used by desktop apps (Windows, macOS, Linux). Type-check and
    # lint it for Windows and macOS without a cross linker (docs/remote-operator.md).
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0 # keep in sync with rust-toolchain.toml
          components: clippy
          targets: x86_64-pc-windows-gnu, x86_64-apple-darwin

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check and lint the remote client for Windows
        run: |
          for features in remote discovery; do
            cargo clippy -p orion-client --no-default-features --features "$features" --target x86_64-pc-windows-gnu --lib --tests --example remote_operator -- -D warnings
          done
          cargo clippy -p orion --no-default-features --features remote --target x86_64-pc-windows-gnu -- -D warnings
          cargo clippy -p orion-transport-ipc --target x86_64-pc-windows-gnu --lib -- -D warnings

      - name: Check and lint the remote client for macOS
        # Library only: on Unix targets the orion-client test/example targets also build the HTTP
        # dev-dependency (ring), which needs a macOS SDK; macos-latest below builds them natively.
        run: |
          for features in remote discovery; do
            cargo clippy -p orion-client --no-default-features --features "$features" --target x86_64-apple-darwin --lib -- -D warnings
          done
          cargo clippy -p orion-client --target x86_64-apple-darwin --lib -- -D warnings
          cargo clippy -p orion-transport-ipc --target x86_64-apple-darwin --lib -- -D warnings

  remote-client-native:
    # Build and run the remote client unit tests natively (including an orion+tcp loopback
    # exchange in orion-transport-ipc). Tests that start an orion-node stay in the Linux jobs.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0 # keep in sync with rust-toolchain.toml

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build and test the remote operator client
        shell: bash
        run: |
          cargo build -p orion-client --no-default-features --features discovery --example remote_operator
          cargo test -p orion-client --no-default-features --features remote
          cargo test -p orion-client --no-default-features --features discovery
          # On Windows this is exactly the platform-neutral part (framing, ControlTcpClient). On
          # macOS it would also run the Linux-oriented Unix socket / fd passing tests.
          if [ "$RUNNER_OS" = "Windows" ]; then
            cargo test -p orion-transport-ipc --lib
          fi

  link-no-std:
    # orion-link must stay no_std for microcontroller targets: framing and the minimal device path
    # (`device`) without an allocator or any dependency, the full-record messages and session
    # conveniences with `alloc`. The MCU template must link as a bare-metal staticlib, including on
    # cores without compare-and-swap (thumbv6m, riscv32imc), and its minimal UART build must stay
    # within the flash/RAM budgets in scripts/mcu-size.sh.
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0 # keep in sync with rust-toolchain.toml
          components: clippy, rustfmt
          targets: thumbv6m-none-eabi, thumbv7em-none-eabihf, thumbv8m.main-none-eabihf, riscv32imc-unknown-none-elf, riscv32imac-unknown-none-elf

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            examples/mcu-template

      - name: orion-link and the MCU template (scripts/ci-jobs.sh link)
        run: ./scripts/ci-jobs.sh link

  no-std:
    # The model crates (core, data-plane, control-plane, auth, runtime, cluster) and the `orion`
    # facade's model features must build `no_std` + `alloc` for bare-metal MCU targets. The script
    # builds each crate in its own cargo invocation (so workspace feature unification cannot hide a
    # std dependency), runs clippy and the host tests without `std`, and checks that the no_std
    # build produces the same canonical rkyv bytes as the std build.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0 # keep in sync with rust-toolchain.toml
          components: clippy
          targets: thumbv7em-none-eabihf, riscv32imac-unknown-none-elf

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check no_std builds (scripts/ci-jobs.sh no-std)
        env:
          NO_STD_TARGETS: thumbv7em-none-eabihf riscv32imac-unknown-none-elf
        run: ./scripts/ci-jobs.sh no-std

  allocator-features:
    # `--all-features` enables both opt-in global allocators at once (jemalloc takes precedence),
    # so each is also linted, built, started, and cross-built on its own, in the appliance feature
    # set they are meant for. One job: the two builds share every other dependency.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0 # keep in sync with rust-toolchain.toml
          components: clippy
          targets: aarch64-unknown-linux-gnu

      - name: Install aarch64 cross compiler
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Allocators (scripts/ci-jobs.sh allocators)
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          AR_aarch64_unknown_linux_gnu: aarch64-linux-gnu-ar
        run: ./scripts/ci-jobs.sh allocators

  appliance-aarch64:
    # The packaged appliance build (packaging/README.md, packaging/gaia/orion-node.toml) for
    # aarch64-unknown-linux-gnu: cross-link the release build, check that the ELF segments are
    # 64 KiB aligned (16 KiB / 64 KiB page kernels), type-check the link-gateway variant, and
    # verify the unit.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0 # keep in sync with rust-toolchain.toml
          targets: aarch64-unknown-linux-gnu

      - name: Install aarch64 cross compiler
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Appliance build (scripts/ci-jobs.sh appliance)
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          AR_aarch64_unknown_linux_gnu: aarch64-linux-gnu-ar
        run: ./scripts/ci-jobs.sh appliance

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0 # keep in sync with rust-toolchain.toml
          components: rustfmt, clippy

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: Run dependency audit
        run: cargo audit

  package-surface:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0 # keep in sync with rust-toolchain.toml
          components: rustfmt, clippy

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Verify package tarballs
        run: ./scripts/verify-package-tarballs.sh

  dependency-hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || contains(github.ref_name, 'release')
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0 # keep in sync with rust-toolchain.toml
          components: rustfmt, clippy

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Report duplicate dependencies
        run: cargo tree -d --workspace

      - name: Install cargo-machete
        uses: taiki-e/install-action@cargo-machete

      - name: Check unused dependency candidates
        run: cargo machete
