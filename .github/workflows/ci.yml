name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.0 # keep in sync with rust-toolchain.toml
          components: rustfmt, clippy

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Run file-size lint
        run: ./scripts/check-file-sizes.sh

      - name: Run workspace tests
        run: cargo test --workspace --all-features

  docs-and-lints:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.0 # keep in sync with rust-toolchain.toml
          components: rustfmt, clippy

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Run clippy on orion-node feature matrix
        run: |
          # IPC-only appliance build (no HTTP stack) and each transport on its own.
          cargo clippy -p orion-node --no-default-features --all-targets -- -D warnings
          cargo clippy -p orion-node --no-default-features --features transport-http --all-targets -- -D warnings
          cargo clippy -p orion-node --no-default-features --features transport-tcp --all-targets -- -D warnings
          cargo clippy -p orion-node --no-default-features --features transport-quic --all-targets -- -D warnings
          cargo clippy -p orion-node --all-targets -- -D warnings

      - name: Test IPC-only orion-node build
        run: cargo test -p orion-node --no-default-features

      - name: Build docs
        run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps

  link-no-std:
    # orion-link must stay no_std and allocation-free for microcontroller targets.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.0 # keep in sync with rust-toolchain.toml
          components: clippy
          targets: thumbv7em-none-eabihf, thumbv8m.main-none-eabihf, riscv32imac-unknown-none-elf

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build and lint orion-link for embedded targets
        run: |
          for target in thumbv7em-none-eabihf thumbv8m.main-none-eabihf riscv32imac-unknown-none-elf; do
            cargo clippy -p orion-link --no-default-features --target "$target" -- -D warnings
            cargo clippy -p orion-link --no-default-features --features embedded-io,embedded-io-async,embedded-can,crc-table --target "$target" -- -D warnings
            cargo build -p orion-link --release --no-default-features --target "$target"
          done

      - name: Test orion-link feature combinations
        run: |
          cargo test -p orion-link --no-default-features
          cargo test -p orion-link --no-default-features --features crc-table
          cargo test -p orion-link --all-features

  no-std:
    # The model crates (core, data-plane, control-plane, auth, runtime, cluster) and the `orion`
    # facade's model features must build `no_std` + `alloc` for bare-metal MCU targets. The script
    # builds each crate in its own cargo invocation (so workspace feature unification cannot hide a
    # std dependency), runs clippy and the host tests without `std`, and checks that the no_std
    # build produces the same canonical rkyv bytes as the std build.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.0 # keep in sync with rust-toolchain.toml
          components: clippy
          targets: thumbv7em-none-eabihf, riscv32imac-unknown-none-elf

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check no_std builds
        env:
          NO_STD_TARGETS: thumbv7em-none-eabihf riscv32imac-unknown-none-elf
        run: ./scripts/check-no-std.sh

  allocator-features:
    # `--all-features` above enables both allocator features at once (jemalloc takes precedence),
    # so each opt-in global allocator is also linted, built, started, and cross-built on its own.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        feature:
          - alloc-mimalloc
          - alloc-jemalloc
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.0 # keep in sync with rust-toolchain.toml
          components: clippy
          targets: aarch64-unknown-linux-gnu

      - name: Install aarch64 cross compiler
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.feature }}

      - name: Run clippy
        run: cargo clippy -p orion-node --all-targets --features ${{ matrix.feature }} -- -D warnings

      - name: Build orion-node
        run: cargo build -p orion-node --features ${{ matrix.feature }}

      - name: Start and stop orion-node
        env:
          ORION_NODE_ID: node.alloc-smoke
          ORION_NODE_HTTP_ADDR: "off"
          ORION_NODE_PEER_AUTH: disabled
          ORION_NODE_SHUTDOWN_AFTER_INIT_MS: "200"
          RUST_LOG: warn
        run: |
          ORION_NODE_IPC_SOCKET="$RUNNER_TEMP/c.sock" \
          ORION_NODE_IPC_STREAM_SOCKET="$RUNNER_TEMP/s.sock" \
          ./target/debug/orion-node

      - name: Cross-build orion-node for aarch64-unknown-linux-gnu
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          AR_aarch64_unknown_linux_gnu: aarch64-linux-gnu-ar
        run: cargo build -p orion-node --features ${{ matrix.feature }} --target aarch64-unknown-linux-gnu

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.0 # keep in sync with rust-toolchain.toml
          components: rustfmt, clippy

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: Run dependency audit
        run: cargo audit

  package-surface:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.0 # keep in sync with rust-toolchain.toml
          components: rustfmt, clippy

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Verify package tarballs
        run: ./scripts/verify-package-tarballs.sh

  dependency-hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || contains(github.ref_name, 'release')
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.0 # keep in sync with rust-toolchain.toml
          components: rustfmt, clippy

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Report duplicate dependencies
        run: cargo tree -d --workspace

      - name: Install cargo-machete
        uses: taiki-e/install-action@cargo-machete

      - name: Check unused dependency candidates
        run: cargo machete
